name: tms_driver
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  flutter_bloc: ^8.1.4
  equatable: ^2.0.5
  get_it: ^7.7.0
  injectable: ^2.4.2
  injectable_generator: ^2.6.1
  dio: ^5.5.0+1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  json_serializable: ^6.8.0
  freezed_annotation: ^2.0.0
  go_router: ^14.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  introduction_screen: ^3.1.14
  json_annotation: ^4.9.0
  flutter_native_splash: ^2.4.1
  table_calendar: ^3.1.2
  flutter_datetime_picker_plus: ^2.2.0
  time_picker_spinner: ^1.0.0

  cupertino_icons: ^1.0.2
  go_router_paths: ^0.2.2
  geolocator: ^12.0.0
  flutter_local_notifications: ^17.2.1+2
  background_fetch: ^1.3.5
  permission_handler: ^11.3.1
  file_picker: ^8.0.6
  image_picker: ^1.1.2
  circle_nav_bar: ^2.1.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5
  path_provider: ^2.1.4
  downloadsfolder: ^1.1.0
  flutter_downloader: ^1.11.8
  url_launcher: ^6.3.0
  r_dotted_line_border: ^0.1.1
  cunning_document_scanner: ^1.2.3

dev_dependencies:
  build_runner: ^2.4.11
  freezed: ^2.5.2
  flutter_launcher_icons: ^0.13.1
  analyzer: ^6.4.1

  flutter_lints: ^4.0.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
flutter_native_splash:
  color: "#FFFFFF"
  icon_background_color: "#FFFFFF"
  image: assets/images/white.jpg
  android: true
  ios: true
  android_12:
    image: assets/images/logo.png
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
flutter_intl:
  enabled: true
  arb_dir: lib/l10n
  output_dir: lib/generated
