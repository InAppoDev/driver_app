plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.tms_master.driver_app"
    compileSdkVersion 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.tms_master.driver_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 21
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // signingConfigs {
    //     release {
    //         storeFile file(localProperties.getProperty('release.storeFile')) 
    //         storePassword localProperties.getProperty('release.storePassword')
    //         keyAlias localProperties.getProperty('release.keyAlias')
    //         keyPassword localProperties.getProperty('release.keyPassword')
    //     }
    // }

    // buildTypes {
    //     debug {}
    //     release {
    //         signingConfig signingConfigs.release

    //         ndk {
    //             debugSymbolLevel 'SYMBOL_TABLE'
    //         }
    //     }
    // }
}

flutter {
    source '../..'
}

dependencies {}

/// ----------
/// ---------- DEBUG SYMBOLS for GOOGLE PLAY
/// ----------

def zipNativeDebugSymbols = tasks.register('zipNativeDebugSymbols', Zip) {
    group = 'Build'
    description = 'Zips debug symbol files for upload to Google Play store.'

    from(file("${buildDir}/intermediates/merged_native_libs/release/out/lib")) {
        include '**/*'
        exclude '**/__MACOSX/**', '**/.DS_Store'
    }

    archiveFileName = 'native-debug-symbols.zip'
    destinationDirectory = file("${buildDir}/outputs/bundle/release")

    // Force the task to run by setting up-to-date to false
    outputs.upToDateWhen { false }

    doLast {
        println '✅ zipNativeDebugSymbols: task executed and zip created.'
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'bundleRelease') {
        task.finalizedBy zipNativeDebugSymbols
    }
}
